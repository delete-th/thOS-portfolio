<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Circular refresh arrow, stepped/pixelated, with a clear triangular arrowhead -->
  <rect x="6" y="1" width="4" height="2" fill="#1a6fb0"/>
  <rect x="10" y="2" width="2" height="2" fill="#1a6fb0"/>
  <rect x="12" y="4" width="2" height="2" fill="#1a6fb0"/>
  <rect x="13" y="6" width="2" height="4" fill="#1a6fb0"/>
  <rect x="12" y="10" width="2" height="2" fill="#1a6fb0"/>
  <rect x="10" y="12" width="2" height="2" fill="#1a6fb0"/>
  <rect x="6" y="13" width="4" height="2" fill="#1a6fb0"/>
  <rect x="4" y="12" width="2" height="2" fill="#1a6fb0"/>
  <rect x="2" y="10" width="2" height="2" fill="#1a6fb0"/>
  <rect x="1" y="6" width="2" height="4" fill="#1a6fb0"/>
  <!-- Arrowhead pointing up-left, sitting at the gap in the circle -->
  <rect x="1" y="2" width="2" height="2" fill="#1a6fb0"/>
  <rect x="3" y="2" width="2" height="2" fill="#1a6fb0"/>
  <rect x="3" y="4" width="2" height="2" fill="#1a6fb0"/>
</svg>
